name: 'Bicep Whatif / Deploy'

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]

# Special permissions required for OIDC authentication
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  LOCATION: "eastus"

jobs:
  # PRs preview only the dev environment so reviewers are not blocked by prod approvals.
  # OIDC subject: repo:ORG/REPO:environment:dev
  whatif-dev:
    name: 'What-if (dev)'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Bicep Lint
      uses: Azure/cli@v1
      with:
        inlineScript: az bicep build --file main.bicep

    - name: Bicep Validate
      uses: Azure/cli@v1
      with:
        inlineScript: |
          az deployment sub validate \
            --name validate-dev-${{ github.run_id }} \
            --template-file main.bicep \
            --parameters params/dev.bicepparam \
            --location $LOCATION

    - name: "What-If"
      uses: Azure/cli@v1
      with:
        inlineScript: |
          az deployment sub what-if \
            --name whatif-dev-${{ github.run_id }} \
            --template-file main.bicep \
            --parameters params/dev.bicepparam \
            --location $LOCATION > whatif

    - name: Create String Output
      id: whatif-string
      run: |
        WHATIF=$(cat whatif)

        delimiter="$(openssl rand -hex 8)"
        echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
        echo "## What-if output (dev)" >> $GITHUB_OUTPUT
        echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "$WHATIF" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "</details>" >> $GITHUB_OUTPUT
        echo "${delimiter}" >> $GITHUB_OUTPUT

    - name: Publish Whatif to Task Summary
      env:
        SUMMARY: ${{ steps.whatif-string.outputs.summary }}
      run: |
        echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

    - name: Push Whatif Output to PR
      uses: actions/github-script@v6
      env:
        SUMMARY: "${{ steps.whatif-string.outputs.summary }}"
      with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `${process.env.SUMMARY}`;
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
            })

  # On merge to main: deploy dev, then staging, then production (one at a time).
  # Manual run can target a single environment.
  # Each job uses its GitHub Environment so OIDC subject is
  # repo:ORG/REPO:environment:<name>
  deploy:
    name: 'Deploy ${{ matrix.environment }}'
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.environment == matrix.environment)
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - environment: dev
            params: params/dev.bicepparam
          - environment: staging
            params: params/staging.bicepparam
          - environment: production
            params: params/prod.bicepparam
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: 'Az CLI login'
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: What-if (pre-deploy)
      uses: Azure/cli@v1
      with:
        inlineScript: |
          az deployment sub what-if \
            --name whatif-${{ matrix.environment }}-${{ github.run_id }} \
            --template-file main.bicep \
            --parameters ${{ matrix.params }} \
            --location $LOCATION

    - name: Bicep Deployment
      uses: Azure/cli@v1
      with:
        inlineScript: |
          az deployment sub create \
            --name deploy-${{ matrix.environment }}-${{ github.run_id }} \
            --template-file main.bicep \
            --parameters ${{ matrix.params }} \
            --location $LOCATION
